name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.16.8" "black==26.5.1"
    - name: Ruff lint
      run: ruff check .
    - name: Black format check
      run: black --check .

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache Datasets
      uses: actions/cache@v4
      with:
        path: ./data
        key: dataset-cache-cifar-mnist-v1
        restore-keys: |
          dataset-cache-cifar-mnist-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pytest-cov
        pip install -e .

    - name: Run unit tests with Coverage
      run: |
        pytest --cov=pal_moe --cov-report=xml tests/test_pal_moe.py -v

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build
      
    - name: Build package distribution
      run: python -m build

  benchmark-verify:
    name: Benchmark Reproducibility Smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Cache Datasets
      uses: actions/cache@v4
      with:
        path: ./data
        key: dataset-cache-mnist-v1
        restore-keys: |
          dataset-cache-mnist-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    - name: Download MNIST
      run: |
        python - <<'PY'
        from torchvision import datasets, transforms
        datasets.MNIST("./data", train=True, download=True,
                       transform=transforms.Compose([transforms.ToTensor()]))
        PY
    - name: CPU benchmark smoke (1 epoch, all 12 methods)
      run: |
        python experiments/run_benchmark.py --epochs 1 --device cpu --output_dir /tmp/ci-bench
    - name: Assert benchmark sanity bounds
      run: |
        python - <<'PY'
        import json
        d = json.load(open("/tmp/ci-bench/benchmark_results_seed42.json"))
        for name in ("PAL-MoE (Ours)", "PAL-MoE + Replay (Hybrid, P=250)", "DER++ (P=250)",
                     "Experience Replay (Buffer=250)", "Naive Fine-tuning"):
            assert name in d, f"missing method in results: {name}"
        hyb = d["PAL-MoE + Replay (Hybrid, P=250)"]["acc"]
        pure = d["PAL-MoE (Ours)"]["acc"]
        naive = d["Naive Fine-tuning"]["acc"]
        print(f"hybrid={hyb:.2%} pure={pure:.2%} naive={naive:.2%}")
        # sanity bounds only (1-epoch CPU smoke, not a SOTA check)
        assert hyb > 0.50, f"hybrid sanity bound failed: {hyb:.2%}"
        assert pure > 0.25, f"pure sanity bound failed: {pure:.2%}"
        assert pure > naive, f"pure PAL-MoE should beat naive fine-tuning: {pure:.2%} vs {naive:.2%}"
        print("benchmark-verify OK")
        PY
    - name: "CPU smoke: feature-cache + frozen encoder + router-anchor distillation"
      run: |
        python experiments/run_benchmark.py --epochs 1 --device cpu --methods palmoe \
          --freeze_encoder --feature_cache --router_anchor_steps 50 \
          --proto_threshold auto --output_dir /tmp/ci-distill
    - name: Assert distillation smoke + run metadata
      run: |
        python - <<'PY'
        import json
        d = json.load(open("/tmp/ci-distill/benchmark_results_seed42.json"))
        assert "PAL-MoE (Ours)" in d, "distill smoke produced no PAL-MoE entry"
        pure = d["PAL-MoE (Ours)"]["acc"]
        print(f"distill smoke pure={pure:.2%}")
        assert pure > 0.20, f"distillation smoke bound failed: {pure:.2%}"
        meta = json.load(open("/tmp/ci-distill/benchmark_meta_seed42.json"))
        assert meta["args"]["feature_cache"] is True
        assert meta["args"]["router_anchor_steps"] == 50
        assert "git_commit" in meta and "duration_sec" in meta
        print("distillation smoke OK")
        PY
