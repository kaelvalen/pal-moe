[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pal-moe"
version = "0.1.0"
description = "Prototype-Anchored Lifelong Mixture of Experts (PAL-MoE) for Continual Learning"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kaelvalen", email = "yintsukuyomi@proton.me" }
]
maintainers = [
    { name = "kaelvalen", email = "yintsukuyomi@proton.me" }
]
requires-python = ">=3.9"
keywords = [
    "continual-learning",
    "lifelong-learning",
    "mixture-of-experts",
    "moe",
    "catastrophic-forgetting",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/kaelvalen/pal-moe"
Repository = "https://github.com/kaelvalen/pal-moe.git"
"Bug Tracker" = "https://github.com/kaelvalen/pal-moe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pal_moe*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["pal_moe", "experiments", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length is enforced by black; long help strings stay intact
    "B008",  # torch.device("cpu") defaults are idiomatic in this codebase
]

[tool.ruff.lint.isort]
known-first-party = ["pal_moe"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
